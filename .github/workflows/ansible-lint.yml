name: ansible-lint

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
      - name: Analysing all playbooks
        run: |
          ansible-lint install/*.yml install/tasks/*.yml --skip-list package-latest,deprecated-bare-vars,deprecated-command-syntax,deprecated-module,unnamed-task,yaml[truthy],role-name,meta-main[unsupported-tags],meta-runtime,var-naming[no-role-prefix],deprecated-module,var-naming[pattern],no-handler -v
      - name: Analysing all playbook roles
        run: |
          ansible-lint install/roles/*/*/*.yml --skip-list package-latest,deprecated-bare-vars,deprecated-command-syntax,deprecated-module,unnamed-task,yaml[truthy],role-name,meta-main[unsupported-tags],meta-runtime,var-naming[no-role-prefix],deprecated-module,var-naming[pattern],no-handler -v
