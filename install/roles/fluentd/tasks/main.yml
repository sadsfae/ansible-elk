---
#
# Install/run fluentd (fluent-package v6 LTS)
#
# Note: This role is only executed on platforms that support fluent-package v6.
# The main playbook automatically falls back to logstash on unsupported platforms.
#

- name: Setup Fluentd Repository (RedHat/Rocky)
  when: ansible_os_family == "RedHat"
  become: true
  block:
    - name: Copy fluentd yum repo file
      ansible.builtin.copy:
        src: fluentd.repo
        dest: /etc/yum.repos.d/fluentd.repo
        owner: root
        group: root
        mode: '0644'

    - name: Import fluentd GPG Key
      ansible.builtin.rpm_key:
        key: https://packages.treasuredata.com/GPG-KEY-td-agent
        state: present

    - name: Install fluent-package and dependencies
      ansible.builtin.dnf:
        name:
          - fluent-package
          - gcc
        state: present

- name: Setup Fluentd Repository (Debian/Ubuntu)
  when: ansible_os_family == "Debian"
  become: true
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg2
          - lsb-release
          - build-essential
        state: present
        update_cache: true

    - name: Add Fluentd GPG key
      ansible.builtin.apt_key:
        url: https://packages.treasuredata.com/GPG-KEY-td-agent
        state: present

    - name: Add fluent-package repository
      ansible.builtin.apt_repository:
        repo: >-
          deb https://packages.treasuredata.com/lts/6/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}/
          {{ ansible_distribution_release }} contrib
        state: present
        filename: fluent-package

    - name: Install fluent-package
      ansible.builtin.apt:
        name: fluent-package
        state: present

- name: Setup fluentd configuration files
  ansible.builtin.template:
    src: fluentd.conf.j2
    dest: /etc/fluent/fluentd.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  register: fluentd_config

# Compatibility tasks (RedHat specific paths)
- name: Configure OpenSSL (RedHat Family)
  when: ansible_os_family == "RedHat"
  become: true
  block:
    - name: Load OpenSSL CA Extended Configuration
      ansible.builtin.template:
        src: openssl_extras.cnf.j2
        dest: /etc/pki/tls/openssl_extras.cnf
        owner: root
        group: root
        mode: '0644'

    - name: Check OpenSSL SANs (SubjectAltName) entry for CA
      ansible.builtin.shell: |
        grep "{{ ansible_default_ipv4.address }}" /etc/pki/tls/openssl.cnf | wc -l
      register: subject_alt_name_exists
      changed_when: false
      failed_when: false

    - name: Add OpenSSL SANs (SubjectAltName) entry for CA
      ansible.builtin.lineinfile:
        dest: /etc/pki/tls/openssl.cnf
        line: 'subjectAltName = "IP: {{ ansible_default_ipv4.address }}"'
        regexp: '^ Extensions for a typical CA'
        insertbefore: '# Extensions for a typical CA'
        backup: true
      when: subject_alt_name_exists.stdout | int == 0

# Install ES plugin (requires v6.0.0+ for Elasticsearch 9.x compatibility)
- name: Install fluentd elasticsearch plugin
  community.general.gem:
    name: fluent-plugin-elasticsearch
    state: latest
    include_dependencies: true
    user_install: false
    executable: /usr/sbin/fluent-gem
  become: true

- name: Install fluentd beats plugin
  community.general.gem:
    name: fluent-plugin-beats
    state: latest
    include_dependencies: true
    user_install: false
    executable: /usr/sbin/fluent-gem
  become: true

- name: Load filebeat JSON index template
  ansible.builtin.uri:
    url: http://localhost:9200/_index_template/filebeat?pretty
    method: PUT
    body: "{{ lookup('file', 'filebeat-index-template.json') }}"
    body_format: json
    return_content: true
  register: filebeatJSON_output
  until: '"json" in filebeatJSON_output and filebeatJSON_output.json.acknowledged == true'
  retries: 30
  delay: 10
  become: true
  when: not install_elasticsearch_xpack | default(false) | bool

- name: Load filebeat JSON index template (security enabled)
  ansible.builtin.uri:
    url: http://localhost:9200/_index_template/filebeat?pretty
    method: PUT
    user: "{{ xpack_elastic_user }}"
    password: "{{ xpack_elastic_user_password }}"
    body: "{{ lookup('file', 'filebeat-index-template.json') }}"
    body_format: json
    return_content: true
  register: filebeatJSON_output
  until: '"json" in filebeatJSON_output and filebeatJSON_output.json.acknowledged == true'
  retries: 30
  delay: 10
  become: true
  when: install_elasticsearch_xpack | default(false) | bool

- name: Start and enable fluentd service
  ansible.builtin.service:
    name: fluentd
    state: started
    enabled: true
  become: true

- name: Restart fluentd if config changed
  ansible.builtin.service:
    name: fluentd
    state: restarted
  when: fluentd_config.changed
  become: true
