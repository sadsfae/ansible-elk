---
#
# Manage firewall rules if enabled
# Change this in ../install/group_vars/all.yml
#

# Consolidate firewall logic using modern Ansible modules
# Detects firewalld vs iptables usage dynamically

- name: Check Firewalld Status
  ansible.builtin.command: systemctl is-active firewalld
  register: firewalld_status
  failed_when: false
  changed_when: false
  check_mode: false
  become: true

- name: Set Firewall Facts
  ansible.builtin.set_fact:
    is_firewalld_active: "{{ firewalld_status.rc == 0 }}"
    fw_rules:
      - port: "{{ es_local_port }}"
        proto: tcp
        condition: "{{ es_listen_external | bool }}"
        comment: "Elasticsearch"
      - port: "{{ logstash_localsyslog_port }}"
        proto: tcp
        condition: "{{ syslog_listen_external | bool }}"
        comment: "Logstash Local Syslog"
      - port: "{{ logstash_syslog_port }}"
        proto: tcp
        condition: true
        comment: "Logstash Syslog"
      - port: "{{ www_kibana_port }}"
        proto: tcp
        condition: true
        comment: "Kibana"
      - port: "{{ elk_server_ssl_cert_port }}"
        proto: tcp
        condition: true
        comment: "ELK SSL"
      - port: "{{ fluentd_syslog_port }}"
        proto: udp
        condition: true
        comment: "Fluentd Syslog"
      - port: "{{ fluentd_http_port }}"
        proto: tcp
        condition: true
        comment: "Fluentd HTTP"

# Firewalld Implementation
- name: Ensure ports are open (firewalld)
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto }}"
    permanent: true
    state: enabled
    zone: public
    immediate: true
  loop: "{{ fw_rules }}"
  when:
    - is_firewalld_active
    - item.condition
  become: true

# Fluentd syslog is UDP-only; prior versions also opened the port as TCP, so
# ensure the superseded TCP rule is removed on upgraded hosts.
- name: Remove obsolete fluentd syslog tcp rule (firewalld)
  ansible.posix.firewalld:
    port: "{{ fluentd_syslog_port }}/tcp"
    permanent: true
    state: disabled
    zone: public
    immediate: true
  when: is_firewalld_active
  become: true

- name: Remove obsolete fluentd syslog tcp rule (iptables)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ fluentd_syslog_port }}"
    jump: ACCEPT
    action: insert
    state: absent
    comment: "Fluentd Syslog"
  when: not is_firewalld_active
  become: true

# Iptables Implementation
# Uses 'insert' to ensure rules are at the top of the chain, similar to original logic
- name: Ensure ports are open (iptables)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    action: insert
    comment: "{{ item.comment }}"
  loop: "{{ fw_rules }}"
  when:
    - not is_firewalld_active
    - item.condition
  register: iptables_update
  become: true

# Persist Iptables Rules
- name: Save iptables rules (RedHat/Rocky)
  ansible.builtin.command: service iptables save
  when:
    - not is_firewalld_active
    - iptables_update.changed
    - ansible_os_family == 'RedHat'
  become: true

- name: Ensure iptables-persistent package is installed (Debian/Ubuntu)
  ansible.builtin.package:
    name: iptables-persistent
    state: present
  when:
    - not is_firewalld_active
    - ansible_os_family == 'Debian'
  become: true

- name: Save iptables rules (Debian/Ubuntu)
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  when:
    - not is_firewalld_active
    - iptables_update.changed
    - ansible_os_family == 'Debian'
  become: true
