---
#
# Install/run kibana
#
# Note a lot of logstash/ES activity happens here too
# Because of service ordering.

- name: Copy kibana yum repo file
  copy:
    src: kibana.repo
    dest: /etc/yum.repos.d/kibana.repo
    owner: root
    group: root
    mode: '0644'
  become: true
  when: ansible_os_family == 'RedHat'

- name: Import Kibana GPG Key (Debian)
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  become: true
  when: ansible_os_family == 'Debian'

- name: Add Kibana repository (Debian)
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/9.x/apt stable main"
    state: present
    filename: kibana-9.x
  become: true
  when: ansible_os_family == 'Debian'

- name: Install kibana packages
  package:
    name:
      - kibana
      - unzip
    state: present
  become: true

- name: Install local rsyslogd for fluentd
  package:
    name: rsyslog
    state: present
  become: true
  when: effective_logging_backend == 'fluentd'

- name: Setup local rsyslogd for fluentd
  lineinfile:
    dest: /etc/rsyslog.conf
    line: "*.* @localhost:{{ fluentd_syslog_port }}"
  when: effective_logging_backend == 'fluentd'
  register: fluentd_rsyslog_config
  become: true

- name: Copy templated kibana.yml
  template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Populate elasticsearch index with local logs via rsyslog
  service:
    name: rsyslog
    state: restarted
  when:
    - effective_logging_backend == 'fluentd'
    - fluentd_rsyslog_config.changed
  become: true

- name: Check kibana users
  stat:
    path: /etc/htpasswd.users
  register: kibana_user_pwfile
  become: true

- name: Create kibana admin user
  command: htpasswd -b -c /etc/htpasswd.users {{ kibana_user }} {{ kibana_password }}
  when: not kibana_user_pwfile.stat.exists
  become: true

- name: Setup kibana service
  service:
    name: kibana
    state: started
    enabled: true
  become: true

- name: Restart kibana server
  service:
    name: kibana
    state: restarted
  when: apache_reverse_proxy | bool
  become: true

- name: Check Filebeat forwarder SSL certificate
  stat:
    path: /usr/share/logstash/beat-forwarder.crt
  register: filebeat_forwarder_ssl
  become: true

- name: Create SSL structure for Fluentd installs
  file:
    path: /usr/share/logstash
    state: directory
    mode: '0755'
  when: effective_logging_backend == 'fluentd'
  become: true

- name: Set OpenSSL configuration path
  set_fact:
    openssl_conf_path: "{{ '/etc/pki/tls/openssl.cnf' if ansible_os_family == 'RedHat' else '/etc/ssl/openssl.cnf' }}"

- name: Load OpenSSL CA Extended Configuration
  template:
    src: openssl_extras.cnf.j2
    dest: "{{ openssl_conf_path | dirname }}/openssl_extras.cnf"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Create client forwarder SSL certificate
  command: >
    openssl req -subj '/CN={{ ansible_fqdn }}/'
    -config {{ openssl_conf_path | dirname }}/openssl_extras.cnf
    -x509 -days 3650 -batch -nodes -newkey rsa:2048
    -keyout /usr/share/logstash/beat-forwarder.key
    -out /usr/share/logstash/beat-forwarder.crt
  when: not filebeat_forwarder_ssl.stat.exists
  become: true

- name: Set Nginx webroot path
  set_fact:
    nginx_webroot: "{{ '/var/www/html' if ansible_os_family == 'Debian' else '/usr/share/nginx/html' }}"

- name: Check Filebeat forwarder SSL certificate copy (Nginx)
  stat:
    path: "{{ nginx_webroot }}/beat-forwarder.crt"
  register: filebeat_ssl_nginx_copy
  when: apache_reverse_proxy is none
  become: true

- name: Check Filebeat forwarder SSL certificate copy (Apache)
  stat:
    path: /var/www/html/beat-forwarder.crt
  register: filebeat_ssl_apache_copy
  when: apache_reverse_proxy | bool
  become: true

- name: Copy Filebeat forwarder SSL certificate for nginx
  copy:
    src: /usr/share/logstash/beat-forwarder.crt
    dest: "{{ nginx_webroot }}/beat-forwarder.crt"
    remote_src: true
    mode: '0644'
  when:
    - apache_reverse_proxy is none
    - not filebeat_ssl_nginx_copy.stat.exists
  become: true

- name: Copy Filebeat forwarder SSL certificate key for nginx
  copy:
    src: /usr/share/logstash/beat-forwarder.key
    dest: "{{ nginx_webroot }}/beat-forwarder.key"
    remote_src: true
    mode: '0600'
  when:
    - apache_reverse_proxy is none
    - not filebeat_ssl_nginx_copy.stat.exists
  become: true

- name: Copy Filebeat forwarder SSL certificate for apache
  copy:
    src: /usr/share/logstash/beat-forwarder.crt
    dest: /var/www/html/beat-forwarder.crt
    remote_src: true
    mode: '0644'
  when:
    - apache_reverse_proxy | bool
    - not filebeat_ssl_apache_copy.stat.exists
  become: true

- name: Copy Filebeat forwarder SSL certificate key for apache
  copy:
    src: /usr/share/logstash/beat-forwarder.key
    dest: /var/www/html/beat-forwarder.key
    remote_src: true
    mode: '0600'
  when:
    - apache_reverse_proxy | bool
    - not filebeat_ssl_apache_copy.stat.exists
  become: true

- name: Set permissions on logstash certificate
  file:
    path: /usr/share/logstash/beat-forwarder.crt
    owner: logstash
    group: logstash
    mode: '0600'
  when: effective_logging_backend != 'fluentd'
  become: true

- name: Set permissions on logstash certificate key
  file:
    path: /usr/share/logstash/beat-forwarder.key
    owner: logstash
    group: logstash
    mode: '0600'
  when: effective_logging_backend != 'fluentd'
  become: true

# We are in the kibana playbook but starting logstash here now
# This is needed because perms should be set on certificates before
# logstash references them for filebeat SSL connections.
- name: Enable logstash service
  service:
    name: logstash
    state: started
    enabled: true
  become: true
  when: effective_logging_backend != 'fluentd'

# For slower connections and to make sure ES is listening
# we will wait for TCP/9200 to become available
- name: Wait for elasticsearch index to be available
  uri:
    url: http://localhost:9200/_cat/indices
    status_code: 200
  register: es_service_result
  until: es_service_result.status == 200
  retries: 50
  delay: 10
  when: not install_elasticsearch_xpack | default(false) | bool
  become: true

# We will use a more generic check if x-pack is installed as it wraps everything
# in additional authentication making it difficult to interpret HTTP status
# codes via success/fail.
- name: Wait for elastic index to be available (X-Pack enabled only generic check)
  wait_for:
    host: localhost
    port: "{{ es_local_port }}"
    delay: 10
    connect_timeout: 5
    timeout: 420
    state: started
  when: install_elasticsearch_xpack | bool
  become: true

# We need to insert data to create an initial index, query if it exists
- name: Check elasticsearch index for content
  uri:
    url: http://localhost:9200/_cat/indices
    method: GET
    return_content: true
  register: elasticsearch_index
  when: not install_elasticsearch_xpack | default(false) | bool
  become: true

# Make sure TCP/5000 is up and listening for logstash
# logstash 5.x takes a long time to start for me
# leaving this set to 7minutes before giving up
- name: Check for TCP/{{ logstash_localsyslog_port }} logstash internal listener port
  wait_for:
    host: localhost
    port: "{{ logstash_localsyslog_port }}"
    delay: 10
    connect_timeout: 5
    timeout: 420
    state: started
  when: effective_logging_backend != 'fluentd'
  become: true

# Make sure TCP/5044 is up and listening for logstash
# logstash 5.x takes a long time to start for me
# leaving this set to 7minutes before giving up
- name: Check for TCP/{{ logstash_syslog_port }} logstash external listener port
  wait_for:
    host: localhost
    port: "{{ logstash_syslog_port }}"
    delay: 10
    connect_timeout: 5
    timeout: 420
    state: started
  when: effective_logging_backend != 'fluentd'
  become: true

# Populate elasticsearch with local syslog data
- name: Populate elasticsearch index with local syslog data
  lineinfile:
    dest: /etc/rsyslog.conf
    line: "*.* @localhost:{{ logstash_localsyslog_port }}"
  when: effective_logging_backend != 'fluentd'
  register: logstash_rsyslog_config
  become: true

- name: Restart rsyslogd to populate elasticsearch index
  service:
    name: rsyslog
    state: restarted
  when:
    - effective_logging_backend != 'fluentd'
    - logstash_rsyslog_config.changed
  become: true

- name: Refresh fluentd service
  service:
    name: fluentd
    state: restarted
  when: effective_logging_backend == 'fluentd'
  become: true
