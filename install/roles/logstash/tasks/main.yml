---
#
# Install/run logstash
#

- name: Set OpenSSL configuration path
  ansible.builtin.set_fact:
    openssl_conf_path: "{{ '/etc/pki/tls/openssl.cnf' if ansible_os_family == 'RedHat' else '/etc/ssl/openssl.cnf' }}"

- name: Copy logstash yum repo file
  ansible.builtin.copy:
    src: logstash.repo
    dest: /etc/yum.repos.d/logstash.repo
    owner: root
    group: root
    mode: '0644'
  become: true
  when: ansible_os_family == 'RedHat'

- name: Ensure dependencies are installed (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'

- name: Add Elastic GPG key (Debian/Ubuntu)
  ansible.builtin.apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  become: true
  when: ansible_os_family == 'Debian'

- name: Add Logstash repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "{{ logstash_apt_repo | default('deb https://artifacts.elastic.co/packages/9.x/apt stable main') }}"
    state: present
    filename: elastic-9.x
  become: true
  when: ansible_os_family == 'Debian'

- name: Install logstash
  ansible.builtin.package:
    name: logstash
    state: present
  become: true

- name: Copy logstash filter configuration
  ansible.builtin.template:
    src: logstash.conf.j2
    dest: /etc/logstash/conf.d/logstash.conf
    owner: logstash
    group: logstash
    mode: '0644'
  become: true

# workaround, sometimes they forget to package this
# https://github.com/elastic/logstash/issues/1130
- name: Ensure logstash systemd unit file is present
  ansible.builtin.copy:
    src: logstash.service
    dest: /etc/systemd/system/logstash.service
    owner: root
    group: root
    mode: '0644'
    force: false
  register: logstash_unit_copied
  become: true

- name: Reload Systemd if we copied in logstash.service unit file  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: logstash_unit_copied.changed
# we need a workaround for netty wanting to use /tmp
# on most systems this is mounted via noexec for security reasons
# https://discuss.elastic.co/t/problem-with-cipher-in-beat-input/67841/5

- name: Create tmpdir for logstash netty
  ansible.builtin.file:
    path: /usr/share/logstash/tmpfile
    state: directory
    owner: logstash
    group: logstash
    mode: '0755'
  become: true

- name: Apply logstash netty tmpdir workaround
  ansible.builtin.lineinfile:
    path: /etc/logstash/jvm.options
    line: '-Dio.netty.native.workdir=/usr/share/logstash/tmpfile/'
  become: true

- name: Load OpenSSL CA Extended Configuration
  ansible.builtin.template:
    src: openssl_extras.cnf.j2
    dest: "{{ openssl_conf_path | dirname }}/openssl_extras.cnf"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Check OpenSSL SANs (SubjectAltName) entry for CA
  ansible.builtin.shell:
    cmd: grep "{{ ansible_default_ipv4.address }}" "{{ openssl_conf_path }}" | wc -l
  ignore_errors: true
  register: subjectAltName_exists
  changed_when: false
  tags:
    # Skip ANSIBLE0012 Commands should not change things if nothing needs doing
    # Need to understand if an entry exists
    - skip_ansible_lint
  become: true

- name: Add OpenSSL SANs (SubjectAltName) entry for CA
  ansible.builtin.lineinfile:
    dest: "{{ openssl_conf_path }}"
    line: 'subjectAltName = "IP: {{ ansible_default_ipv4.address }}"'
    regexp: '^ Extensions for a typical CA'
    insertbefore: '# Extensions for a typical CA'
    backup: true
  when: subjectAltName_exists.stdout | int == 0
  become: true

- name: Load filebeat JSON index template
  ansible.builtin.uri:
    url: http://localhost:9200/_index_template/filebeat?pretty
    method: PUT
    body: "{{ lookup('file', 'filebeat-index-template.json') }}"
    body_format: json
    return_content: true
  register: filebeatJSON_output
  until: '"json" in filebeatJSON_output and filebeatJSON_output.json.acknowledged == true'
  retries: 30
  delay: 10
  become: true
  when: not install_elasticsearch_xpack | default(false) | bool

## Disable IPv6 because logstash/udp syslog has issues with it.
# https://github.com/logstash-plugins/logstash-input-syslog/issues/42
- name: Disable IPv6 with sysctl
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    reload: true
  with_items:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
    - net.ipv6.conf.lo.disable_ipv6
  become: true
  ignore_errors: true

- name: Determine if ipv6 is a loadable module
  ansible.builtin.command: /sbin/lsmod
  register: ipv6loadable
  ignore_errors: true
  changed_when: false

- name: Disable IPv6 via modprobe.d
  ansible.builtin.lineinfile:
    dest: /etc/modprobe.d/disable-ipv6.conf
    line: 'install ipv6 /bin/true'
    create: true
    mode: '0644'
  notify:
    - rmmodipv6
  when: "'ipv6' in ipv6loadable.stdout"
  ignore_errors: true
  become: true

- ansible.builtin.include_tasks: ipv6-grub-disable.yml

- name: Disabling IPv6 via sysconfig/network (RedHat)
  ansible.builtin.lineinfile:
    dest: /etc/sysconfig/network
    regexp: "^{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
    create: true
    mode: '0644'
  with_items:
    - { regexp: 'NETWORKING_IPV6=.*', line: 'NETWORKING_IPV6=NO' }
    - { regexp: 'IPV6INIT=.*', line: 'IPV6INIT=no' }
  notify:
    - restart Network
    - restart NetworkManager
  when: ansible_os_family == 'RedHat'
  ignore_errors: true
  become: true

# X-Pack requires additional authentication
- name: Load filebeat JSON index template (X-Pack enabled)
  ansible.builtin.uri:
    url: http://localhost:9200/_index_template/filebeat?pretty
    method: PUT
    user: "{{ xpack_elastic_user }}"
    password: "{{ xpack_elastic_user_password }}"
    body: "{{ lookup('file', 'filebeat-index-template.json') }}"
    body_format: json
    return_content: true
  register: filebeatJSON_output
  until: '"json" in filebeatJSON_output and filebeatJSON_output.json.acknowledged == true'
  retries: 30
  delay: 10
  become: true
  when: install_elasticsearch_xpack | default(false) | bool
